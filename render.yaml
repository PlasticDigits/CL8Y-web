services:
  - type: web
    name: CL8Y-web
    runtime: static
    buildCommand: yarn install --immutable && yarn build
    staticPublishPath: ./dist
    # Serve prerendered directory indexes (see public/_redirects). Without these,
    # /blog/:slug hits SPA /* fallback and crawlers see homepage OG tags only.
    routes:
      - type: rewrite
        source: /blog/*
        destination: /blog/*/index.html
      - type: rewrite
        source: /blog
        destination: /blog/index.html
      # GitLab #12 — legal-guess paths must not rewrite to index.html (404 via miss target).
      - type: rewrite
        source: /privacy
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacy/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacy-policy
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacy-policy/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacy_policy
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacy_policy/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacypolicy
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacypolicy/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacy-notice
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /privacy-notice/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookies
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookies/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookie
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookie/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookie-policy
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookie-policy/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookies-policy
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /cookies-policy/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /opt-out
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /opt-out/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /optout
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /optout/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /opt_out
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /opt_out/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /do-not-sell
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /do-not-sell/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /donotsell
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /donotsell/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /ccpa
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /ccpa/
        destination: /__cl8y_reserved_legal_guess_miss__
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Install runs only via buildCommand (avoids duplicate install when false).
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Required for absolute og:url / og:image / canonical URLs in prerendered HTML.
      - key: VITE_SITE_ORIGIN
        value: https://cl8y.com
      - key: NODE_OPTIONS
        value: "--max-old-space-size=6144"
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
